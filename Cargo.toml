[package]
name = "rustonrails"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
form_urlencoded = "1"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"

[workspace]
members = ["examples/blog"]
